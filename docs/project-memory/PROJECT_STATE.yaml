active_workstream:
  id: "agent_capability_foundation"
  objective: "Create a project-wide, source-pinned and independently reviewed role/skill system for Yorso."
  status: "local_lab_validation"
  completed:
    - "Created 13 accountable role profiles under .agents/agents."
    - "Registered 11 project-wide skills with ownership, reviewer, provenance, license and dependencies."
    - "Added immutable content lock and fail-closed governance checks."
    - "Added a multilingual UX copywriter role with en, ru and es-ES review requirements."
    - "Documented role-to-skill provenance matrix, routing, pilot protocol and Stage A results."
    - "Removed hidden mutating cleanup from build and provider-boundary prehooks."
    - "Added a non-mutating gate verifier and project-memory freshness check."
    - "Pinned external repository/revision/license declarations and local adaptation hashes; exact upstream blob-byte verification remains open."
    - "Added structured Stage B and main-promotion evidence gates."
    - "Upgraded Stage B and promotion evidence to schemaVersion 5 with fixture-oracle binding, structured output/gate artifacts, signed reviewer sheets and recomputed metrics."
    - "Upgraded the actor registry to schemaVersion 2 with canonical independence groups, Ed25519 identities and an out-of-band registry trust anchor; one public-key-only Stage B executor is now registered while human review and promotion remain closed."
    - "Expanded candidate freshness to every tracked repository path except signed evidence results and project-memory attestations; rejected canonical-identity aliases, reviewer-supplied denominators, cross-skill artifact reuse and project-memory symlink escapes."
    - "Expanded non-mutation checks to reject gate-created commits, branch switches and any ref mutation."
    - "Expanded non-mutation checks to safely reject ignored provider scaffold, symlinks, special files and oversized observer inputs, and made those wrappers mandatory in ci:core."
    - "Added provider-free retirement and self-hosted policy tests to the mandatory tooling suite."
    - "Archived expanded pre-foundation state and handoff with SHA-256 plus byte-for-byte source-commit verification."
    - "Upgraded reviewer sheets to schemaVersion 4, binding signatures to the evaluated commit, candidate skill hash, fixture-oracle hash and every run output path plus SHA-256."
    - "Added real Git integration tests for post-candidate evidence commits and repository-backed promotion validation without repository-inspection bypass."
    - "Expanded mutation fingerprints to regular ignored files such as .env.local while retaining explicit exclusions for generated heavy directories."
    - "Configured GitHub CI push validation for local-lab/** branches."
    - "Added an executable Stage B blind-pilot CLI with 30 randomized task files, identity-bound outputs, reviewer-facing arm redaction, public-key-only actor enrollment, fail-closed status and separate qualification/main-promotion checks."
    - "Initialized ignored pilot workspace copywriter-2026-08 against exact commit dc86aae5331d84836ab428929ba602d0420f35a9 with 30 tasks and a reviewer queue that omits arm mappings."
    - "Added a reproducible Stage B executor workflow: stage-b:next emits one commit-bound arm-isolated packet, and stage-b:submit-output records canonical executor identity plus packet and response SHA-256 without exposing coordinator arm mappings."
    - "Hardened Stage B executor provenance: every task has an immutable assignment to a registered stage-b-executor, every response is bound to a canonical payload and Ed25519 signature, and status plus blind-review preparation reject assignment, packet, response, key or signature drift."
    - "Accepted the first genuine isolated Stage B executor response for task a93017b304142d7845e8 after external Ed25519 signing; one earlier run that exposed user skills was rejected and never submitted."
    - "Completed the Stage B execution campaign with 30/30 immutable assignments, 30/30 valid Ed25519-signed outputs and 0 invalid signed outputs, then generated a 30-item blind reviewer packet without candidate, arm, run-key or evaluated-commit identity leakage."
    - "Added a fail-closed human reviewer workflow: complete blind drafts use only reviewItemId, canonical reviewer-sheet-v4 payloads are prepared only after decisions are frozen, detached Ed25519 signatures are verified externally and status revalidates every sheet against current packet and output evidence."
    - "Hardened the operator runbook after rejecting an unsigned shared-parent attempt whose event trace exposed operator files: executor work, temporary CODEX_HOME and operator logs/signing artifacts must use separate physical roots and every trace must be inspected before signing."
  open_gates:
    - "Run the complete Stage B blind comparative pilot before claiming a measured quality uplift."
    - "Register real human reviewers and approvers with signed identities and distinct canonical independence groups, then trust the registry digest out-of-band before Stage B evidence can pass."
