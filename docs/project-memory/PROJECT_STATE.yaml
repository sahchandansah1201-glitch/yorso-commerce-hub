    - "Archived expanded pre-foundation state and handoff with SHA-256 plus byte-for-byte source-commit verification."
    - "Upgraded reviewer sheets to schemaVersion 4, binding signatures to the evaluated commit, candidate skill hash, fixture-oracle hash and every run output path plus SHA-256."
    - "Added real Git integration tests for post-candidate evidence commits and repository-backed promotion validation without repository-inspection bypass."
    - "Expanded mutation fingerprints to regular ignored files such as .env.local while retaining explicit exclusions for generated heavy directories."
    - "Configured GitHub CI push validation for local-lab/** branches."
    - "Added an executable Stage B blind-pilot CLI with 30 randomized task files, identity-bound outputs, reviewer-facing arm redaction, public-key-only actor enrollment, fail-closed status and separate qualification/main-promotion checks."
    - "Initialized ignored pilot workspace copywriter-2026-08 against exact commit dc86aae5331d84836ab428929ba602d0420f35a9 with 30 tasks and a reviewer queue that omits arm mappings."
